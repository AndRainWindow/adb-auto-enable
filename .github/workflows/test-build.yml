name: Build Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/wireless-pairing-discovery

permissions:
  contents: read

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run debug unit tests and build debug APK
        run: >-
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          -PCI_VERSION_NAME="0.0.1-test-${GITHUB_SHA::7}"

      - name: Verify pinned debug signing certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
              | grep -i "SHA-256 digest" || echo "(no certificate digest printed)"
          else
            echo "apksigner not available; certificate check skipped"
          fi

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: adb-auto-enable-test-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
